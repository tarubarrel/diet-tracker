<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Diet Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f0f0f;
    --surface: #1a1a1a;
    --surface2: #242424;
    --border: #2e2e2e;
    --accent: #c8f55a;
    --accent2: #ff6b4a;
    --text: #f0f0f0;
    --text2: #888;
    --text3: #555;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans JP', sans-serif;
    min-height: 100vh;
    max-width: 430px;
    margin: 0 auto;
    padding-bottom: 100px;
  }

  /* Header */
  .header {
    padding: 20px 20px 0;
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 100;
    border-bottom: 1px solid var(--border);
    padding-bottom: 12px;
  }
  .header-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }
  .logo {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 22px;
    letter-spacing: -0.5px;
  }
  .logo span { color: var(--accent); }
  .date-nav {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .date-nav button {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    width: 28px; height: 28px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 14px;
    display: flex; align-items: center; justify-content: center;
  }
  .date-display {
    font-size: 13px;
    color: var(--text2);
    font-weight: 500;
    min-width: 80px;
    text-align: center;
  }

  /* Tab nav */
  .tab-nav {
    display: flex;
    gap: 4px;
    padding: 0 20px 12px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .tab-nav::-webkit-scrollbar { display: none; }
  .tab-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--text2);
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 12px;
    cursor: pointer;
    white-space: nowrap;
    font-family: 'Noto Sans JP', sans-serif;
    transition: all 0.2s;
  }
  .tab-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #000;
    font-weight: 700;
  }

  /* Pages */
  .page { display: none; padding: 16px 20px; }
  .page.active { display: block; }

  /* Summary cards */
  .summary-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 16px;
  }
  .summary-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 14px;
  }
  .summary-card.wide {
    grid-column: 1 / -1;
  }
  .card-label {
    font-size: 11px;
    color: var(--text2);
    margin-bottom: 4px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }
  .card-value {
    font-family: 'Syne', sans-serif;
    font-size: 28px;
    font-weight: 700;
    color: var(--accent);
    line-height: 1;
  }
  .card-value.danger { color: var(--accent2); }
  .card-unit { font-size: 13px; color: var(--text2); margin-left: 2px; }

  /* Progress bar */
  .progress-wrap {
    margin-top: 10px;
  }
  .progress-bar {
    height: 6px;
    background: var(--surface2);
    border-radius: 3px;
    overflow: hidden;
    margin-top: 6px;
  }
  .progress-fill {
    height: 100%;
    border-radius: 3px;
    background: var(--accent);
    transition: width 0.5s ease;
  }
  .progress-fill.danger { background: var(--accent2); }
  .progress-label {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: var(--text2);
    margin-top: 4px;
  }

  /* Weight trend mini */
  .weight-mini {
    display: flex;
    align-items: flex-end;
    gap: 4px;
    height: 40px;
    margin-top: 8px;
  }
  .weight-bar {
    flex: 1;
    background: var(--accent);
    border-radius: 3px 3px 0 0;
    opacity: 0.6;
    transition: height 0.3s;
  }
  .weight-bar.today { opacity: 1; }

  /* Section title */
  .section-title {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text3);
    margin: 20px 0 10px;
  }

  /* Log list */
  .log-list { display: flex; flex-direction: column; gap: 8px; }
  .log-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 12px 14px;
    display: flex;
    align-items: center;
    gap: 12px;
    position: relative;
  }
  .log-icon {
    width: 40px; height: 40px;
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
    overflow: hidden;
  }
  .log-icon img {
    width: 100%; height: 100%;
    object-fit: cover;
    border-radius: 10px;
  }
  .log-icon.food { background: #1e2a0f; }
  .log-icon.drink { background: #0f1e2a; }
  .log-icon.exercise { background: #2a0f1e; }
  .log-info { flex: 1; min-width: 0; }
  .log-name {
    font-size: 14px;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .log-time { font-size: 11px; color: var(--text2); margin-top: 2px; }
  .log-cal {
    font-family: 'Syne', sans-serif;
    font-size: 16px;
    font-weight: 700;
    color: var(--accent);
    flex-shrink: 0;
  }
  .log-cal.negative { color: var(--accent2); }
  .delete-btn {
    position: absolute;
    top: 8px; right: 8px;
    background: none;
    border: none;
    color: var(--text3);
    cursor: pointer;
    font-size: 14px;
    padding: 2px 4px;
    line-height: 1;
  }
  .delete-btn:hover { color: var(--accent2); }

  /* FAB */
  .fab {
    position: fixed;
    bottom: 24px;
    right: calc(50% - 215px + 20px);
    max-right: 20px;
    background: var(--accent);
    color: #000;
    border: none;
    width: 56px; height: 56px;
    border-radius: 50%;
    font-size: 24px;
    cursor: pointer;
    box-shadow: 0 4px 20px rgba(200,245,90,0.4);
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.2s, box-shadow 0.2s;
    z-index: 200;
  }
  .fab:active { transform: scale(0.92); }

  /* Modal */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.8);
    z-index: 300;
    align-items: flex-end;
    justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--surface);
    border-radius: 24px 24px 0 0;
    padding: 20px;
    width: 100%;
    max-width: 430px;
    max-height: 90vh;
    overflow-y: auto;
    animation: slideUp 0.3s ease;
  }
  @keyframes slideUp {
    from { transform: translateY(100%); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
  .modal-handle {
    width: 36px; height: 4px;
    background: var(--border);
    border-radius: 2px;
    margin: 0 auto 16px;
  }
  .modal-title {
    font-family: 'Syne', sans-serif;
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 16px;
  }

  /* Type selector */
  .type-selector {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-bottom: 16px;
  }
  .type-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px 4px;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s;
  }
  .type-btn.selected {
    border-color: var(--accent);
    background: rgba(200,245,90,0.1);
  }
  .type-btn .emoji { font-size: 20px; display: block; margin-bottom: 4px; }
  .type-btn .label { font-size: 10px; color: var(--text2); }
  .type-btn.selected .label { color: var(--accent); }

  /* Photo upload */
  .photo-area {
    border: 2px dashed var(--border);
    border-radius: 16px;
    padding: 20px;
    text-align: center;
    cursor: pointer;
    margin-bottom: 12px;
    transition: border-color 0.2s;
  }
  .photo-area:hover { border-color: var(--accent); }
  .photo-area.has-image { border-style: solid; border-color: var(--accent); padding: 4px; }
  .photo-area img { width: 100%; border-radius: 12px; max-height: 200px; object-fit: cover; }
  .photo-area .photo-placeholder { color: var(--text2); }
  .photo-area .photo-placeholder .ph-icon { font-size: 32px; margin-bottom: 8px; }
  .photo-area .photo-placeholder p { font-size: 13px; }
  #photoInput { display: none; }

  /* AI analyze btn */
  .analyze-btn {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 12px;
    border-radius: 12px;
    font-size: 14px;
    cursor: pointer;
    font-family: 'Noto Sans JP', sans-serif;
    margin-bottom: 12px;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .analyze-btn:hover:not(:disabled) {
    border-color: var(--accent);
    color: var(--accent);
  }
  .analyze-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  /* AI Advice */
  .ai-advice-card {
    background: linear-gradient(135deg, rgba(200,245,90,0.08), rgba(200,245,90,0.02));
    border: 1px solid rgba(200,245,90,0.25);
    border-radius: 20px;
    padding: 20px;
    margin-bottom: 14px;
  }
  .ai-advice-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
  }
  .ai-avatar {
    width: 40px; height: 40px;
    background: var(--accent);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
  }
  .ai-name {
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 15px;
  }
  .ai-name span { color: var(--accent); }
  .ai-advice-body {
    font-size: 14px;
    line-height: 1.8;
    color: var(--text2);
    min-height: 60px;
  }
  .ai-advice-body.loading {
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--text3);
    font-size: 13px;
  }
  .advice-btn {
    width: 100%;
    background: var(--accent);
    border: none;
    color: #000;
    padding: 14px;
    border-radius: 14px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    font-family: 'Noto Sans JP', sans-serif;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: opacity 0.2s;
  }
  .advice-btn:active { opacity: 0.8; }
  .advice-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .advice-type-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 16px;
  }
  .advice-type-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 12px;
    cursor: pointer;
    transition: all 0.2s;
    text-align: center;
  }
  .advice-type-card:hover, .advice-type-card.selected {
    border-color: var(--accent);
    background: rgba(200,245,90,0.06);
  }
  .advice-type-card .atc-icon { font-size: 24px; margin-bottom: 6px; }
  .advice-type-card .atc-label { font-size: 12px; font-weight: 500; }
  .advice-type-card .atc-desc { font-size: 11px; color: var(--text3); margin-top: 2px; }
  .chat-area {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 14px;
    max-height: 50vh;
    overflow-y: auto;
  }
  .chat-bubble {
    max-width: 85%;
    padding: 10px 14px;
    border-radius: 16px;
    font-size: 13px;
    line-height: 1.7;
  }
